### Deye Agent — MQTT collector for Zabbix Agent 2
# https://www.zabbix.com/integrations/mqtt

# Maximum time for connections and subscriptions (seconds)
Plugins.MQTT.Timeout=10

# Session configuration called "deye_agent"
Plugins.MQTT.Sessions.deye_agent.Url=tcp://127.0.0.1:1883
Plugins.MQTT.Sessions.deye_agent.Topic=solar/deye/#
Plugins.MQTT.Sessions.deye_agent.User=deye
Plugins.MQTT.Sessions.deye_agent.Password=PASSW

# (Optional) TLS files if a secure connection is required
#Plugins.MQTT.Sessions.deye_agent.TLSCAFile=/path/to/ca.crt
#Plugins.MQTT.Sessions.deye_agent.TLSCertFile=/path/to/client.crt
#Plugins.MQTT.Sessions.deye_agent.TLSKeyFile=/path/to/client.key
