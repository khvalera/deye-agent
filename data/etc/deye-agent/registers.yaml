    cancel_emoji: "🔋✅"

  - name: "Load Power"
    address: 178
    count: 2
    scale: 1
    unit: "W"
    type: "int"
    alarm: null
    cancel: null
    alarm_emoji: "🔥⛔"
    cancel_emoji: "🔥✅"
