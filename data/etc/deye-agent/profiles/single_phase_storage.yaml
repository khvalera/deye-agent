profile:
  id: single_phase_storage
  family: Single-phase storage inverter
  status: hardware-validated
  notes: Register map validated on a 5 kW single-phase storage inverter; exact 5 kW model identifier has not yet been recorded. Do not reuse this map for three-phase
    storage inverters. PV/DC registers 108-112 validated on two-MPPT hardware. Warning/fault
    raw words 100-106 validated in Normal state. Register 107 Corrected_AH validated
    at 200 Ah. Registers 117-124 intentionally not exposed because 117/118 semantics
    differ between documents, 119 does not match the documented PV-damage mapping
    on this firmware, and 120-124 are documented debug data. Realtime range 150-196
    validated as one contiguous 47-register Modbus read on the same 5 kW single-phase storage inverter.
