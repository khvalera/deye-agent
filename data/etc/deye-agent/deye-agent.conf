# Protocol profile
# Hardware-validated family: 5 kW single-phase storage inverter.
# Exact model identifier of the currently validated unit is not recorded.
PROFILE=single_phase_storage

# Optional legacy/custom register-map override.
# If PROFILE is set, PROFILE takes precedence.
# REGISTERS_FILE=/etc/deye-agent/registers.yaml

# Debug
DEBUG=false

# RS485
PORT="/dev/ttyUSB0"
BAUDRATE=9600
SLAVE_ID=1

# RS485 read reliability
READ_ATTEMPTS=3
RETRY_DELAY=0.2

# Monitoring
UPDATE_INTERVAL=60

# Alarm confirmation
# Number of consecutive valid abnormal readings required before an alarm.
ALARM_CONFIRMATIONS=2

# MQTT
MQTT_ENABLED=true
MQTT_HOST=127.0.0.1
MQTT_PORT=1883
MQTT_USERNAME=deye
MQTT_PASSWORD=passw
MQTT_TOPIC=solar/deye

# Stable metrics MQTT publishing
MQTT_METRICS_ENABLED=true
MQTT_CONNECT_TIMEOUT=5
MQTT_PUBLISH_TIMEOUT=5

# Cached HTTP API + web dashboard
# Authentication is mandatory whenever HTTP_API_ENABLED=true.
HTTP_API_ENABLED=false
HTTP_API_HOST=127.0.0.1
HTTP_API_PORT=8765

# Generate a password hash interactively:
#   deye-agent auth-hash
HTTP_AUTH_USERNAME=admin
HTTP_AUTH_PASSWORD_HASH=
HTTP_AUTH_SESSION_SECONDS=43200

# Keep false for direct HTTP. Set true only when the browser reaches
# this service through HTTPS.
HTTP_AUTH_COOKIE_SECURE=false

# RAM-only web history
HTTP_HISTORY_ENABLED=true
HTTP_HISTORY_MAX_SAMPLES=720
HTTP_HISTORY_RETENTION_SECONDS=21600

# Notifications EMAIL
NOTIFY_EMAIL_ENABLED=false
NOTIFY_EMAIL_TO=youremail@example.com
NOTIFY_EMAIL_FROM=deye-agent@example.com
NOTIFY_EMAIL_SMTP_SERVER=smtp.example.com
NOTIFY_EMAIL_SMTP_PORT=587
NOTIFY_EMAIL_SMTP_USER=smtp_user
NOTIFY_EMAIL_SMTP_PASSWORD=smtp_password

# Notifications via Matrix
NOTIFY_MATRIX_ENABLED=false
NOTIFY_MATRIX_HOMESERVER=https://matrix.org
NOTIFY_MATRIX_ACCESS_TOKEN=YOUR_ACCESS_TOKEN
NOTIFY_MATRIX_ROOM_ID=!yourRoomId:matrix.org
